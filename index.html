<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Χάρτης Καταστημάτων</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #map {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: #eef1f4;
            z-index: 1;
        }
        .search-panel {
            position: fixed;
            top: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            width: min(510px, 92vw);
        }
        .search-row {
            display: flex;
            align-items: center;
            background: white;
            border-radius: 30px;
            padding: 8px 15px 8px 20px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.22);
        }
        #storeSearchInput {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            padding: 12px 8px;
            color: #333;
            min-width: 0;
        }
        #storeSearchInput::placeholder { color: #8a8a8a; }
        .search-button {
            border: none;
            background: transparent;
            color: #777;
            font-size: 28px;
            cursor: pointer;
            padding: 0 6px;
        }
        .search-button:hover { color: #ff6600; }
        .location-button {
            margin-top: 12px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 25px;
            background: #ff6600;
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0,0,0,0.18);
        }
        .location-button:hover { background: #e65c00; }
        #searchResultsContainer { display: none; margin-top: 10px; }
        .results-actions { text-align: right; height: 28px; }
        .results-actions button {
            border: none;
            background: rgba(255,255,255,0.96);
            font-size: 20px;
            cursor: pointer;
            color: #666;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            line-height: 24px;
            margin-left: 5px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }
        #searchResults {
            background: white;
            border-radius: 18px;
            padding: 12px;
            max-height: 360px;
            overflow-y: auto;
            font-size: 13px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.22);
        }
        .result-card {
            background: #fff7f0;
            border-left: 5px solid #ff6600;
            margin-bottom: 9px;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
        }
        .result-card:hover { background: #ffe3cc; }
        .result-name { font-weight: bold; color: #2b2b2b; }
        .result-address { color: #555; margin-top: 4px; }
        .result-distance { color: #ff6600; font-weight: bold; margin-top: 4px; }
        .result-count { font-weight: bold; margin-bottom: 10px; color: #ff6600; }
        .error-msg { color: #dc3545; font-weight: bold; line-height: 1.35; }
        .map-error {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: white;
            z-index: 99999;
            padding: 30px;
            text-align: center;
            font-size: 18px;
            color: #b00020;
        }
        @media (max-width: 768px) {
            .search-panel { top: 10px; width: 92vw; }
            #searchResults { max-height: 230px; }
            #storeSearchInput { font-size: 14px; }
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="search-panel">
        <div class="search-row">
            <input id="storeSearchInput" type="text"
                   placeholder="Αναζήτηση καταστήματος ή διεύθυνσης"
                   autocomplete="off">
            <button class="search-button" onclick="searchStore()" title="Αναζήτηση">⌕</button>
        </div>
        <button class="location-button" onclick="findNearestStores()">
            Βρες κοντινά καταστήματα
        </button>
        <div id="searchResultsContainer">
            <div class="results-actions">
                <button id="minimizeResults" onclick="toggleResults()" title="Ελαχιστοποίηση">−</button>
                <button onclick="hideResultsContainer()" title="Κλείσιμο">×</button>
            </div>
            <div id="searchResults"></div>
        </div>
    </div>
    <div id="mapError" class="map-error">
        Ο χάρτης δεν μπόρεσε να φορτώσει. Κάνε ανανέωση ή έλεγξε αν ο browser μπλοκάρει το Leaflet CDN.
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script>
        if (typeof L === "undefined") {

                map.setView(bounds[0], 14);
            } else if (bounds.length > 1) {
                map.fitBounds(bounds, {padding: [25, 25]});
            } else {
                map.setView([38.2, 23.7], 7);
            }
            setTimeout(function() { map.invalidateSize(); }, 200);
        }
        function showResultsContainer() {
            document.getElementById("searchResultsContainer").style.display = "block";
            document.getElementById("searchResults").style.display = "block";
            document.getElementById("minimizeResults").textContent = "−";
        }
        function hideResultsContainer() {
            document.getElementById("searchResultsContainer").style.display = "none";
        }
        function toggleResults() {
            const results = document.getElementById("searchResults");
            const btn = document.getElementById("minimizeResults");
            if (results.style.display === "none") {
                results.style.display = "block";
                btn.textContent = "−";
            } else {
                results.style.display = "none";
                btn.textContent = "+";
            }
        }
        function goToStore(index) {
            if (!map) return;
            const result = stores[index];
            map.setView([result.lat, result.lon], 16);
            if (storeLayers[index]) storeLayers[index].openPopup();
            hideResultsContainer();
        }
        function renderResults(results, title, showDistance) {
            const resultsDiv = document.getElementById("searchResults");
            if (results.length === 0) {
                resultsDiv.innerHTML = "<div class='error-msg'>Δεν βρέθηκαν αποτελέσματα.</div>";
                showResultsContainer();
                return;
            }
            let out = "<div class='result-count'>" + escapeText(title) + "</div>";
            results.forEach(function(result, listIndex) {
                out += "<div class='result-card' onclick='goToStore(" + result.index + ")'>" +
                       "<div class='result-name'>" + (listIndex + 1) + ". " + escapeText(result.name) + "</div>" +
                       "<div class='result-address'>📍 " + escapeText(result.address) + "</div>";
                if (showDistance && Number.isFinite(result.distance)) {
                    out += "<div class='result-distance'>" + result.distance.toFixed(2) + " km μακριά</div>";
                }
                out += "</div>";
            });
            resultsDiv.innerHTML = out;
            showResultsContainer();
        }
        function zoomToResults(results) {
            if (!map || results.length === 0) return;
            const bounds = results.map(r => [r.lat, r.lon]);
            if (bounds.length === 1) map.setView(bounds[0], 16);
            else map.fitBounds(bounds, {padding: [25, 25]});
        }
        function searchStore() {
            const q = document.getElementById("storeSearchInput").value;
            const query = normalizeText(q);
            const resultsDiv = document.getElementById("searchResults");
            if (!query) {
                resultsDiv.innerHTML = "<div class='error-msg'>Γράψε όνομα ή διεύθυνση.</div>";
                showResultsContainer();
                return;
            }
            const results = stores.map(function(s, index) {
                return {index, name:s.name, address:s.address, lat:s.lat, lon:s.lon};
            }).filter(function(s) {
                return normalizeText(s.name).includes(query) || normalizeText(s.address).includes(query);
            });
            if (results.length > 0) {
                renderResults(results, "Βρέθηκαν " + results.length + " αποτελέσματα", false);
                zoomToResults(results);
            } else {
                geocodeTypedAddress(q);
            }
        }
        function geocodeTypedAddress(query) {
            const resultsDiv = document.getElementById("searchResults");
            resultsDiv.innerHTML = "<div class='result-count'>Αναζήτηση διεύθυνσης...</div>";
            showResultsContainer();
            const url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=gr,cy&accept-language=el&q=" + encodeURIComponent(query);
            fetch(url)
            .then(function(response) {
                if (!response.ok) throw new Error("HTTP " + response.status);
                return response.json();
            })
            .then(function(data) {
                if (!data.length) {
                    resultsDiv.innerHTML = "<div class='error-msg'>Δεν βρέθηκε ούτε κατάστημα ούτε διεύθυνση: " + escapeText(query) + "</div>";
                    return;
                }
                const userLat = parseFloat(data[0].lat);
                const userLon = parseFloat(data[0].lon);
                const displayName = data[0].display_name || query;
                if (userLocationMarker && map) map.removeLayer(userLocationMarker);
                if (map) {
                    userLocationMarker = L.marker([userLat, userLon]).addTo(map)
                        .bindPopup("<b>Η διεύθυνση που έβαλες</b><br>" + escapeText(displayName)).openPopup();
                }
                const nearest = stores.map(function(s, index) {
                    return {
                        index, name:s.name, address:s.address, lat:s.lat, lon:s.lon,
                        distance: distanceKm(userLat, userLon, s.lat, s.lon)
                    };
                }).sort((a,b) => a.distance - b.distance).slice(0,5);
                renderResults(nearest, "Κοντινότερα 5 καταστήματα από τη διεύθυνση", true);
                if (map) {
                    const bounds = nearest.map(r => [r.lat, r.lon]);
                    bounds.push([userLat, userLon]);
                    map.fitBounds(bounds, {padding: [25,25]});
                }
            })
            .catch(function(error) {
                console.error(error);
                resultsDiv.innerHTML = "<div class='error-msg'>Δεν μπόρεσε να γίνει αναζήτηση διεύθυνσης αυτή τη στιγμή.</div>";
            });
        }
        function findNearestStores() {
            const resultsDiv = document.getElementById("searchResults");
            if (!navigator.geolocation) {
                resultsDiv.innerHTML = "<div class='error-msg'>Ο browser δεν υποστηρίζει τοποθεσία.<br>Γράψε μια διεύθυνση στο πεδίο αναζήτησης.</div>";
                showResultsContainer();
                return;
            }
            resultsDiv.innerHTML = "<div class='result-count'>Ζητείται πρόσβαση στην τοποθεσία...</div>";
            showResultsContainer();
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const userLat = position.coords.latitude;
                    const userLon = position.coords.longitude;
                    if (userLocationMarker && map) map.removeLayer(userLocationMarker);
                    if (map) {
                        userLocationMarker = L.marker([userLat, userLon]).addTo(map)
                            .bindPopup("<b>Η τοποθεσία σου</b>").openPopup();
                    }
                    const nearest = stores.map(function(s, index) {
                        return {
                            index, name:s.name, address:s.address, lat:s.lat, lon:s.lon,
                            distance: distanceKm(userLat, userLon, s.lat, s.lon)
                        };
                    }).sort((a,b) => a.distance - b.distance).slice(0,5);
                    renderResults(nearest, "Κοντινότερα 5 καταστήματα", true);
                    if (map) {
                        const bounds = nearest.map(r => [r.lat, r.lon]);
                        bounds.push([userLat, userLon]);
                        map.fitBounds(bounds, {padding: [25,25]});
                    }
                },
                function(error) {
                    let message = "Η τοποθεσία δεν είναι διαθέσιμη.";
                    if (error && error.code === 1) message = "Δεν έχει δοθεί άδεια τοποθεσίας στον browser.";
                    else if (error && error.code === 2) message = "Ο browser δεν μπόρεσε να βρει την τοποθεσία.";
                    else if (error && error.code === 3) message = "Έληξε ο χρόνος αναμονής για την τοποθεσία.";
                    resultsDiv.innerHTML = "<div class='error-msg'>" + escapeText(message) +
                        "<br>Μπορείς να γράψεις μια διεύθυνση στο πεδίο αναζήτησης.</div>";
                    showResultsContainer();
                },
                {enableHighAccuracy: true, timeout: 10000, maximumAge: 300000}
            );
        }
        document.getElementById("storeSearchInput").addEventListener("keydown", function(e) {
            if (e.key === "Enter") searchStore();
        });
        window.addEventListener("load", initializeMap);
    </script>
</body>
</html>
